<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar / Cadastrar - Portal de Inteligência</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#7e22ce',
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased flex items-center justify-center min-h-screen p-4">

    <!-- Card Centralizado -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md overflow-hidden">
        
        <!-- Cabeçalho do Card (Logo) -->
        <div class="bg-slate-50 p-6 text-center border-b border-slate-100">
            <a href="index.html" class="inline-flex items-center cursor-pointer">
                <i class="ph ph-briefcase text-brand-purple text-3xl mr-2"></i>
                <span class="font-extrabold text-xl tracking-tight text-brand-dark">
                    Portal<span class="text-brand-purple">Inteligência</span>
                </span>
            </a>
            <p class="text-sm text-slate-500 mt-2">Acesse sua conta ou cadastre-se grátis.</p>
        </div>

        <!-- Abas (Tabs) -->
        <div class="flex border-b border-slate-200">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-4 text-center font-bold text-brand-purple border-b-2 border-brand-purple transition-colors">
                Entrar
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-4 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors">
                Cadastrar
            </button>
        </div>

        <div class="p-8">
            <!-- Mensagens de Alerta (Sucesso/Erro) -->
            <div id="alert-message" class="hidden mb-4 p-3 rounded-lg text-sm font-semibold text-center"></div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="form-login" class="space-y-5 animate-in fade-in duration-300">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <div class="relative">
                        <i class="ph ph-envelope absolute left-3 top-3 text-slate-400 text-lg"></i>
                        <input type="email" id="login-email" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-purple focus:border-transparent transition-all" placeholder="seu@email.com">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700">Senha</label>
                        <a href="#" class="text-xs text-brand-purple hover:underline font-medium">Esqueceu?</a>
                    </div>
                    <div class="relative">
                        <i class="ph ph-lock absolute left-3 top-3 text-slate-400 text-lg"></i>
                        <input type="password" id="login-senha" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-purple focus:border-transparent transition-all" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-brand-purple hover:bg-purple-600 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex justify-center items-center">
                    Acessar Conta
                </button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="form-register" class="space-y-5 hidden animate-in fade-in duration-300">
                
                <!-- Toggle Tipo de Usuário -->
                <div class="flex p-1 bg-slate-100 rounded-xl mb-4">
                    <button type="button" id="btn-type-candidato" onclick="setUserType('candidato')" class="flex-1 py-2 text-sm font-bold bg-white text-slate-800 rounded-lg shadow-sm transition-all">
                        Sou Candidato
                    </button>
                    <button type="button" id="btn-type-empresa" onclick="setUserType('empresa')" class="flex-1 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 transition-all">
                        Sou Empresa
                    </button>
                    <input type="hidden" id="reg-tipo-usuario" value="candidato">
                </div>

                <!-- Campos Dinâmicos: Candidato -->
                <div id="fields-candidato" class="space-y-4 block">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
                        <input type="text" id="reg-nome" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="João da Silva">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">CPF</label>
                        <input type="text" id="reg-cpf" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="000.000.000-00">
                    </div>
                </div>

                <!-- Campos Dinâmicos: Empresa -->
                <div id="fields-empresa" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Razão Social / Nome Fantasia</label>
                        <input type="text" id="reg-empresa-nome" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="Nome da sua empresa">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">CNPJ</label>
                        <input type="text" id="reg-cnpj" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="00.000.000/0001-00">
                    </div>
                </div>

                <!-- Campos Comuns -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="seu@email.com">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                        <input type="password" id="reg-senha" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Confirmar</label>
                        <input type="password" id="reg-senha-confirma" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-purple focus:outline-none" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="btn-register" class="w-full bg-brand-dark hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex justify-center items-center">
                    Criar Minha Conta
                </button>
            </form>
        </div>
    </div>

    <!-- Script de Funcionalidade e Conexão com Backend API -->
    <script>
        // Configuração da API do Render (Atualizado conforme conversas anteriores)
        const API_BASE_URL = 'https://onrender.com';

        // Lógica de alternância de abas (Tabs)
        function switchTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const alertMsg = document.getElementById('alert-message');

            alertMsg.classList.add('hidden'); // Limpa mensagens ao trocar de aba

            if (tab === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                
                tabLogin.className = "flex-1 py-4 text-center font-bold text-brand-purple border-b-2 border-brand-purple transition-colors";
                tabRegister.className = "flex-1 py-4 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors";
            } else {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                
                tabRegister.className = "flex-1 py-4 text-center font-bold text-brand-purple border-b-2 border-brand-purple transition-colors";
                tabLogin.className = "flex-1 py-4 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors";
            }
        }

        // Lógica de alternância de tipo de usuário (Candidato vs Empresa)
        function setUserType(type) {
            const btnCandidato = document.getElementById('btn-type-candidato');
            const btnEmpresa = document.getElementById('btn-type-empresa');
            const fieldsCandidato = document.getElementById('fields-candidato');
            const fieldsEmpresa = document.getElementById('fields-empresa');
            
            document.getElementById('reg-tipo-usuario').value = type;

            if (type === 'candidato') {
                fieldsCandidato.classList.remove('hidden');
                fieldsEmpresa.classList.add('hidden');

                btnCandidato.className = "flex-1 py-2 text-sm font-bold bg-white text-slate-800 rounded-lg shadow-sm transition-all";
                btnEmpresa.className = "flex-1 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 transition-all";
            } else {
                fieldsCandidato.classList.add('hidden');
                fieldsEmpresa.classList.remove('hidden');

                btnEmpresa.className = "flex-1 py-2 text-sm font-bold bg-white text-slate-800 rounded-lg shadow-sm transition-all";
                btnCandidato.className = "flex-1 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 transition-all";
            }
        }

        // Função utilitária para exibir alertas
        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById('alert-message');
            alertEl.textContent = message;
            alertEl.className = `mb-4 p-3 rounded-lg text-sm font-semibold text-center ${
                type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
            }`;
            alertEl.classList.remove('hidden');
        }

        // Submissão do Login
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i>';
            btn.disabled = true;

            const payload = {
                email: document.getElementById('login-email').value,
                senha: document.getElementById('login-senha').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Login realizado com sucesso! Redirecionando...', 'success');
                    // Salva o token JWT no localStorage para manter o usuário logado
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('tipo_usuario', data.tipo_usuario);
                    
                    // Simulação de redirecionamento (Ajuste para as suas rotas reais)
                    setTimeout(() => {
                        window.location.href = data.tipo_usuario === 'empresa' ? 'dashboard-empresa.html' : 'dashboard-candidato.html';
                    }, 1500);
                } else {
                    showAlert(data.error || 'Erro ao realizar login.');
                }
            } catch (error) {
                showAlert('Erro de conexão com o servidor.');
            } finally {
                btn.innerHTML = 'Acessar Conta';
                btn.disabled = false;
            }
        });

        // Submissão do Cadastro
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const senha = document.getElementById('reg-senha').value;
            const senhaConfirma = document.getElementById('reg-senha-confirma').value;

            if (senha !== senhaConfirma) {
                return showAlert('As senhas não coincidem.');
            }

            const btn = document.getElementById('btn-register');
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i>';
            btn.disabled = true;

            const tipoUsuario = document.getElementById('reg-tipo-usuario').value;
            
            // Constrói o payload dinâmico baseado no tipo de usuário
            const payload = {
                tipo_usuario: tipoUsuario,
                email: document.getElementById('reg-email').value,
                senha: senha
            };

            if (tipoUsuario === 'empresa') {
                payload.nome_fantasia = document.getElementById('reg-empresa-nome').value;
                payload.cnpj = document.getElementById('reg-cnpj').value;
            } else {
                // Adaptar conforme a tabela 'candidatos' criada no backend
                payload.nome = document.getElementById('reg-nome').value;
                payload.cpf = document.getElementById('reg-cpf').value;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Conta criada com sucesso! Faça login para continuar.', 'success');
                    document.getElementById('form-register').reset();
                    setTimeout(() => switchTab('login'), 2000);
                } else {
                    showAlert(data.error || 'Erro ao criar conta.');
                }
            } catch (error) {
                showAlert('Erro de conexão com o servidor.');
            } finally {
                btn.innerHTML = 'Criar Minha Conta';
                btn.disabled = false;
            }
        });
    </script>
</body>
                  </html>
