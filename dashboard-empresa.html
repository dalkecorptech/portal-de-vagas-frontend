<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Empresa - Portal de Inteligência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#7e22ce',
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">
    <!-- Navbar Restrita -->
    <nav class="bg-brand-dark text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <i class="ph ph-buildings text-3xl mr-2 text-white"></i>
                    <span class="font-extrabold text-xl tracking-tight">
                        Portal<span class="text-brand-purple">Inteligência</span>
                    </span>
                    <span class="ml-4 px-3 py-1 bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold rounded-full">
                        Área da Empresa
                    </span>
                </div>
                <div>
                    <button onclick="fazerLogout()" class="text-slate-400 hover:text-white font-medium transition-colors flex items-center">
                        <i class="ph ph-sign-out text-xl mr-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Gestão de Vagas</h1>
                <p class="text-slate-500 mt-1">Publique novas oportunidades e gerencie seus candidatos.</p>
            </div>
            <button class="bg-brand-purple hover:bg-purple-600 text-white px-5 py-2.5 rounded-xl font-semibold transition-all shadow-md flex items-center">
                <i class="ph ph-plus-circle text-xl mr-2"></i> Publicar Vaga
            </button>
        </div>

        <!-- Seção de Ações -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center mt-10">
            <i class="ph ph-briefcase text-5xl text-slate-300 mb-4"></i>
            <h2 class="text-xl font-bold text-slate-800 mb-2">Nenhuma vaga publicada ainda</h2>
            <p class="text-slate-500 mb-6 max-w-lg mx-auto">Comece a atrair os melhores talentos publicando sua primeira oportunidade na nossa plataforma.</p>
        </div>
    </main>

    <!-- Script de Autenticação -->
    <script>
        // Trava de Segurança: Verifica se o usuário está logado e é empresa
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const tipoUsuario = localStorage.getItem('tipo_usuario');

            if (!token || tipoUsuario !== 'empresa') {
                alert('Acesso negado. Por favor, faça login como empresa.');
                window.location.href = 'login.html';
            }
        });

        // Função de Logout
        function fazerLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('tipo_usuario');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
